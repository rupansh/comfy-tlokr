[project]
name = "comfyui-tlokr"
version = "0.1.0"
description = "ComfyUI and SwarmUI support for Anima T-LoKr adapters"
readme = "README.md"
authors = [
    { name = "Rupansh Sekar", email = "rupanshsekar@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "safetensors>=0.4.5",
]

[project.entry-points."comfyui.custom_nodes"]
comfyui_tlokr = "comfyui_tlokr"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
